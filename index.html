<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webstore</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background: #222;
            color: white;
            padding: 25px;
        }
        .container {
            background: white;
            margin: 30px auto;
            padding: 25px;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Webstore</h1>
        <p>Selamat datang di toko online kami!</p>
    </header>

    <div class="container">
        <h2>Produk Kami</h2>
        <p>Produk pilihan tersedia di sini.</p>
        <button onclick="alert('Terima kasih sudah mengunjungi Webstore!')">
            Lihat Produk
        </button>
    </div>
</body>
</html>
